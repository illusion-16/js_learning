 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body style = "background-color: crimson;">
    0	UNSENT	Client has been created. open() not called yet.
  1	OPENED	open() has been called.
  2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
  3	LOADING	Downloading; responseText holds partial data.
  4	DONE	The operation is complete.
 </body>
 <script>
    const requestUrl = 'https://api.github.com/users/illusion-16'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl) 
    xhr.onreadystatechange = function(){
          console.log(xhr.readyState);
          if(xhr.readyState == 4){
            //  console.log(this.responseText); // this - is used when refering to current context 
          // when we call for a data here we get it in string form sinnce its fromm url , so we have to convert it to object 
            const data = JSON.parse(this.responseText); //parse converts string to object 
             console.log(typeof data);
             console.log(data.followers);
          }
    }
    xhr.send() // calling xhr
 </script>
 </html>
